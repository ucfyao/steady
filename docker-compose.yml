services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: steady
      POSTGRES_PASSWORD: steady
      POSTGRES_DB: steady
    # Host port 5433 so a locally installed Postgres on 5432 does not clash.
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U steady -d steady']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
